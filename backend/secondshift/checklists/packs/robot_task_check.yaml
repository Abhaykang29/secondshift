  - cardboard box
  safety_prompts: []
  cannot_see_note: null
  fixes:
  - id: fix-burnable-near-stove
    title: Clear the area around the cooktop
    how: Move towels, paper and packaging away from the cooktop and oven handle.
    difficulty: easy
    cost_estimate: free
    visualization_prompt: 'Show the same view after this fix: move towels, paper and packaging away from
      the cooktop and oven handle.'
  sources:
  - NFPA home fire safety guidance (paraphrased)
  dedupe_key: stove_combustibles
  thin_object: true
  sweep_anchor_prompts:
  - stove
  - cooktop
  - oven
- id: JOB-OVEN-DOOR-OPEN
