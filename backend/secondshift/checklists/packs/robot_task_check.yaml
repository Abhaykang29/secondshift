version: 1
status: approved
pack_id: robot_task_check
title: 'Job check: is the task done, and is it safe?'
audience: Anyone checking what a robot or a person left behind after a task - cooking, cleanup, tidying
  or leaving the house
high_risk_zones:
- kitchen
- living
- hallway
severity_weights:
  1: 1.0
  2: 2.0
  3: 3.0
items:
- id: JOB-STOVE-LEFT-ON
  title: Stove or cooktop left on
  kind: presence
  rooms:
  - any
  severity: 3
  observable_evidence: A burner or cooktop zone visibly on after the task - lit indicator lights, glowing
    coil or flame
  sam_prompts:
  - cooktop
  - stove burner
  - stove indicator light
  - gas flame
  safety_prompts: []
  cannot_see_note: A camera can show a burner is on; it cannot promise one is off. Check the controls
    in person.
  fixes:
  - id: fix-stove-left-on
    title: Turn the cooktop off
    how: Switch the burner off at its control, move the pan off the hot zone, and wait for the hot-surface
      light to go out.
    difficulty: easy
    cost_estimate: free
    visualization_prompt: 'Show the same view after this fix: switch the burner off at its control, move
      the pan off the hot zone, and wait for the hot-surface light to go out.'
  sources:
  - NFPA home fire safety guidance (paraphrased) - unattended cooking is a leading cause of home fires
  dedupe_key: stove_left_on
- id: JOB-PAN-ON-HOT-STOVE
  title: Pot or pan left on the stove
  kind: presence
  rooms:
  - any
  severity: 2
  observable_evidence: A pot or pan still sitting on the cooktop after cooking
  sam_prompts:
  - pot on stove
  - frying pan on stove
  safety_prompts: []
  cannot_see_note: null
  fixes:
  - id: fix-pan-on-hot-stove
    title: Move the pan off the stove
    how: Take the pot or pan off the cooktop once cooking is finished.
    difficulty: easy
    cost_estimate: free
    visualization_prompt: 'Show the same view after this fix: take the pot or pan off the cooktop once
      cooking is finished.'
  sources:
  - SecondShift job-check checklist (team-written, not an external standard)
- id: JOB-BURNABLE-NEAR-STOVE
  title: Something that can burn on or next to the cooktop
  kind: presence
  rooms:
  - any
  severity: 3
  observable_evidence: Towel, paper, packaging or plastic on or touching the cooktop or oven
  sam_prompts:
